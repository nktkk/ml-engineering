[build-system]
requires = ["setuptools==75.6.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mlkit"
version = "0.1.0"
description = "ML-алгоритмы, написанные с нуля (менторские спринты)"
requires-python = ">=3.12"
dependencies = [
    "numpy==2.1.3",
    "pandas==2.2.3",
    "scikit-learn==1.5.2",
    "matplotlib==3.9.2",
    "scipy==1.14.1",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "jupyter==1.1.1",
    "ipykernel==6.29.5",
    "nbformat==5.10.4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
